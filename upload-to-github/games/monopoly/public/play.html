<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd6ea">
<title>Greekopoly — Player</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body { font-size: 17px; }
  .screen { max-width: 560px; margin: 0 auto; padding: 16px 16px 110px; }
  h1.logo { font-size: 2.8rem; text-align: center; margin: 12px 0 2px; }
  input[type=text] { font: inherit; font-size: 1.4rem; width: 100%; padding: 14px 16px; border-radius: 18px; border: 3px solid #e2d8ff; outline: none; color: var(--ink); background: #fff; }
  input[type=text]:focus { border-color: var(--pink); }
  .tokens { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .tokens button { font-size: 2.3rem; padding: 10px 0 6px; border-radius: 20px; border: 4px solid transparent; display: flex; flex-direction: column; align-items: center; }
  .tokens button small { font-size: .7rem; color: var(--ink-soft); }
  .tokens button.sel { border-color: var(--pink); background: #fff0f7; transform: scale(1.06); }
  .label { font-weight: 600; margin: 18px 0 8px; font-size: 1.15rem; }

  #hdr { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px; padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top));
    background: rgba(255,255,255,.92); backdrop-filter: blur(8px); box-shadow: 0 4px 16px rgba(59,42,122,.1); }
  #hdr .me { font-size: 2.2rem; width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; border: 4px solid; background: #fff; }
  #hdr .cash { font-size: 1.7rem; }
  .turn-banner { text-align: center; padding: 14px; border-radius: 20px; font-size: 1.25rem; font-weight: 600; margin-bottom: 14px; }
  .turn-banner.mine { background: linear-gradient(90deg, #ffd1e6, #e2d6ff); animation: glow 1.6s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: 0 0 0 6px rgba(255,95,162,.25); } }
  .turn-banner.other { background: rgba(255,255,255,.7); }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .hint { text-align: center; color: var(--ink-soft); font-size: .95rem; }

  nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; gap: 8px; padding: 10px 12px; padding-bottom: max(10px, env(safe-area-inset-bottom)); background: rgba(255,255,255,.95); box-shadow: 0 -4px 16px rgba(59,42,122,.12); z-index: 10; }
  nav button { flex: 1; display: flex; flex-direction: column; align-items: center; font-size: .9rem; font-weight: 600; padding: 8px 4px; box-shadow: none; background: transparent; position: relative; }
  nav button span { font-size: 1.7rem; }
  nav button b { font-weight: 600; }
  nav button.on { background: #ffe8f3; color: #d43c80; }
  nav .dot { position: absolute; top: 4px; right: 18%; width: 12px; height: 12px; border-radius: 50%; background: var(--red); }

  .grp { margin-bottom: 14px; }
  .grp-h { display: flex; align-items: center; gap: 8px; font-weight: 700; margin: 6px 2px; }
  .grp-h i { width: 18px; height: 18px; border-radius: 6px; }
  .prop { background: #fff; border-radius: 18px; padding: 12px; box-shadow: var(--shadow); margin-bottom: 8px; border-left: 10px solid; }
  .prop.mort { opacity: .7; background: #f4f1fa; }
  .prop .top { display: flex; align-items: center; gap: 8px; font-size: 1.15rem; font-weight: 600; }
  .prop .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .prop .acts button { padding: 8px 10px; font-size: .9rem; border-radius: 14px; }

  .pick-players { display: flex; gap: 8px; flex-wrap: wrap; }
  .pick-players button { font-size: 1.1rem; border: 3px solid transparent; }
  .pick-players button.sel { border-color: var(--pink); background: #fff0f7; }
  .tchips { display: flex; flex-wrap: wrap; gap: 6px; }
  .tchips button { padding: 6px 10px; font-size: .9rem; border-radius: 12px; border: 3px solid transparent; box-shadow: 0 2px 0 rgba(59,42,122,.15); }
  .tchips button.sel { border-color: var(--pink); background: #fff0f7; }
  .stepper { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .stepper button { padding: 6px 10px; font-size: .95rem; }
  .stepper b { min-width: 70px; text-align: center; font-size: 1.2rem; }
  .offer { background: linear-gradient(150deg, #fff, #fff3fa); border: 3px solid var(--pink-2); }
  .offer ul { margin: 6px 0; padding-left: 20px; }
  .bidbtns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .wait-anim { font-size: 3.4rem; text-align: center; animation: float 2.4s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-10px) rotate(-4deg); } }
  .mini-dice { display: flex; gap: 10px; justify-content: center; }
</style>
</head>
<body>
<div id="joinScreen" class="screen hidden">
  <h1 class="logo">Greekopoly</h1>
  <div class="center muted" style="font-size:1.1rem" id="joinTag"></div>
  <div id="codeBox" class="hidden">
    <div class="label" data-i="ph.gameCode">Game code (on the big screen)</div>
    <input type="text" id="codeIn" maxlength="4" autocapitalize="characters" autocomplete="off" placeholder="ABCD" style="text-transform:uppercase;letter-spacing:8px;text-align:center">
  </div>
  <div class="label" data-i="ph.name">What's your name?</div>
  <input type="text" id="nameIn" maxlength="14" autocomplete="off" placeholder="Your name" data-ip="ph.namePh">
  <div class="label" data-i="ph.pick">Pick your character</div>
  <div class="tokens" id="tokenPick"></div>
  <button class="btn-pink huge" id="joinBtn" style="margin-top:22px" data-i="ph.join">Join the game! 💖</button>
</div>

<div id="waitScreen" class="screen hidden center">
  <h1 class="logo">Greekopoly</h1>
  <div class="wait-anim" id="waitMe"></div>
  <div style="font-size:1.5rem;font-weight:600" data-i="ph.youreIn">You're in! 🎉</div>
  <div class="muted" style="font-size:1.1rem;margin:6px 0 18px" data-i="ph.waitHost">Waiting for the host to start the game…</div>
  <div class="panel" id="waitList"></div>
</div>

<div id="gameScreen" class="hidden">
  <div id="hdr">
    <div class="me" id="hMe"></div>
    <div class="grow"><div style="font-weight:600;font-size:1.15rem" id="hName"></div><div class="muted" style="font-size:.9rem" id="hSub"></div></div>
    <div class="cash money" id="hCash"></div>
  </div>
  <div class="screen" id="tabPlay"></div>
  <div class="screen hidden" id="tabMine"></div>
  <div class="screen hidden" id="tabTrade"></div>
  <nav>
    <button data-tab="Play" class="on"><span>🎲</span><b data-i="ph.tabPlay">Play</b></button>
    <button data-tab="Mine"><span>🏠</span><b data-i="ph.tabMine">My places</b></button>
    <button data-tab="Trade"><span>🤝</span><b data-i="ph.tabTrade">Trade</b><i class="dot hidden" id="tradeDot"></i></button>
  </nav>
</div>

<div id="modal" class="overlay hidden"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="shared/board.js"></script>
<script src="shared/i18n.js"></script>
<script src="common.js"></script>
<script src="play.js"></script>
</body>
</html>
